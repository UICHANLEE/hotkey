<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#08090d" />
    <title>Stream Deck Style Macro Pad</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="is-locked">
    <main class="app-shell" aria-label="Stream Deck style macro pad">
      <section class="deck-wrap">
        <div class="deck-case" aria-label="Macro pad case">
          <div class="case-glint"></div>
          <div class="status-rail">
            <div>
              <p class="eyebrow">Toss CX</p>
              <h1>Audio Clipping for Busan</h1>
            </div>
            <div class="deck-actions">
              <div class="deck-status" id="deckStatus">READY</div>
              <button class="icon-btn" id="settingsToggle" type="button" aria-label="설정 열기" title="Settings">
                <span data-icon="settings"></span>
              </button>
            </div>
          </div>
          <div class="last-command" id="lastCommand">컴퓨터에서 Pair Code를 만들고 있습니다.</div>
          <div class="button-grid" id="buttonGrid"></div>
        </div>
      </section>

      <aside class="control-panel" id="controlPanel" aria-label="Macro settings">
        <div class="panel-head">
          <div>
            <p class="eyebrow">SETTINGS</p>
            <h2 id="panelTitle">Deck Layout</h2>
          </div>
          <div class="panel-actions">
            <button class="icon-btn" id="resetDeck" type="button" aria-label="기본 프리셋으로 초기화" title="Reset">
              <span data-icon="refresh"></span>
            </button>
            <button class="icon-btn" id="closeSettings" type="button" aria-label="설정 닫기" title="Close">
              <span data-icon="x"></span>
            </button>
          </div>
        </div>

        <div class="host-pairing" id="hostPairing">
          <div>
            <p class="eyebrow">PHONE LINK</p>
            <h2 id="hostPairCode">------</h2>
          </div>
          <a id="qrLink" href="#" target="_blank" rel="noreferrer">
            <img id="qrImage" alt="휴대폰 연결 QR 코드" />
          </a>
          <p class="pair-copy">휴대폰 카메라로 QR을 스캔하거나, 같은 링크에서 위 숫자를 입력하세요.</p>
        </div>

        <div class="profile-row">
          <label for="profileSelect">Profile</label>
          <select id="profileSelect"></select>
          <button class="icon-btn" id="addProfile" type="button" aria-label="프로필 추가" title="Add profile">
            <span data-icon="plus"></span>
          </button>
        </div>

        <div class="bridge-row">
          <label for="bridgeCode">Pair Code</label>
          <input id="bridgeCode" type="text" inputmode="numeric" maxlength="8" autocomplete="one-time-code" />
          <button class="text-btn" id="saveBridge" type="button">Link</button>
        </div>

        <div class="control-row">
          <label for="rowsInput">Rows</label>
          <input id="rowsInput" type="number" min="1" max="5" inputmode="numeric" />
        </div>
        <div class="control-row">
          <label for="colsInput">Columns</label>
          <input id="colsInput" type="number" min="1" max="8" inputmode="numeric" />
        </div>

        <div class="settings-button-list" id="settingsButtonList" aria-label="편집할 단축키 선택"></div>

        <div class="divider"></div>

        <div class="editor-empty" id="editorEmpty">버튼을 선택하세요.</div>
        <form class="editor" id="buttonEditor" hidden>
          <div class="field">
            <label for="labelInput">Label</label>
            <input id="labelInput" type="text" maxlength="10" autocomplete="off" />
          </div>
          <div class="field">
            <label for="captionInput">Name</label>
            <input id="captionInput" type="text" maxlength="24" autocomplete="off" />
          </div>
          <div class="field">
            <label for="keyRecorder">Shortcut</label>
            <button class="recorder" id="keyRecorder" type="button">
              <span id="shortcutText">Record keys</span>
              <span data-icon="keyboard"></span>
            </button>
          </div>
          <div class="field">
            <label>Icon</label>
            <div class="icon-picker" id="iconPicker"></div>
          </div>
          <div class="field">
            <label for="imageInput">Image</label>
            <div class="upload-line">
              <input id="imageInput" type="file" accept="image/*" />
              <button class="text-btn" id="clearImage" type="button">Clear</button>
            </div>
          </div>
          <div class="button-line">
            <button class="text-btn danger" id="clearButton" type="button">Clear Button</button>
            <button class="text-btn primary" id="saveButton" type="submit">Apply</button>
          </div>
        </form>
      </aside>
    </main>

    <form class="pair-overlay" id="pairOverlay" aria-label="Pair code required">
      <div class="pair-card">
        <p class="eyebrow">PAIRING</p>
        <h2>Pair Code</h2>
        <p class="pair-copy">컴퓨터 화면에 표시된 코드를 입력해야 단축키가 열립니다.</p>
        <div class="pair-line">
          <input id="pairCodeInput" type="text" inputmode="numeric" maxlength="8" autocomplete="one-time-code" />
          <button class="text-btn primary" type="submit">Link</button>
        </div>
        <p class="pair-message" id="pairMessage">컴퓨터 화면에 표시된 Pair Code를 입력하세요.</p>
      </div>
    </form>

    <div class="rotate-overlay" aria-live="polite">
      <div class="phone-tilt">
        <span data-icon="smartphone"></span>
      </div>
      <p>가로로 돌려주세요</p>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
